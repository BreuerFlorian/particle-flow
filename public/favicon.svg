<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="g1" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#b8dcff"/>
      <stop offset="100%" stop-color="#5a9de6"/>
    </radialGradient>
    <radialGradient id="g2" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ffd6b8"/>
      <stop offset="100%" stop-color="#e6845a"/>
    </radialGradient>
    <radialGradient id="g3" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#c8ffb8"/>
      <stop offset="100%" stop-color="#6ecf5a"/>
    </radialGradient>
    <radialGradient id="g4" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#f0b8ff"/>
      <stop offset="100%" stop-color="#c05ae6"/>
    </radialGradient>
    <radialGradient id="g5" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#ffe0b8"/>
      <stop offset="100%" stop-color="#e6b85a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle ambient glow rings -->
  <circle cx="170" cy="190" r="90" fill="none" stroke="#5a9de6" stroke-width="0.5" opacity="0.15"/>
  <circle cx="340" cy="300" r="70" fill="none" stroke="#6ecf5a" stroke-width="0.5" opacity="0.12"/>

  <!-- Particles with glow -->
  <circle cx="170" cy="190" r="58" fill="url(#g1)" opacity="0.92" filter="url(#softglow)"/>
  <circle cx="340" cy="155" r="38" fill="url(#g2)" opacity="0.90" filter="url(#glow)"/>
  <circle cx="260" cy="320" r="68" fill="url(#g3)" opacity="0.88" filter="url(#softglow)"/>
  <circle cx="390" cy="340" r="30" fill="url(#g4)" opacity="0.90" filter="url(#glow)"/>
  <circle cx="140" cy="370" r="24" fill="url(#g5)" opacity="0.85" filter="url(#glow)"/>

  <!-- Tiny accent particles -->
  <circle cx="430" cy="130" r="10" fill="#7eb8f7" opacity="0.6" filter="url(#glow)"/>
  <circle cx="100" cy="120" r="8" fill="#f77ea8" opacity="0.5" filter="url(#glow)"/>
  <circle cx="450" cy="420" r="12" fill="#a8f77e" opacity="0.45" filter="url(#glow)"/>
</svg>
